name: Sync upstream
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: custom
          fetch-depth: 0
          # GitHub's built-in token may not push changes to workflow files, which
          # upstream sometimes makes; SYNC_TOKEN is a token for this repository
          # with the Workflows permission.
          token: ${{ secrets.SYNC_TOKEN || github.token }}
      - name: Merge upstream into custom
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Silo-Server/silo-android.git
          git fetch upstream main
          git push origin refs/remotes/upstream/main:refs/heads/main

          # A trial merge lists the files where both sides changed the same lines. The real
          # merge below keeps the fork's version there, so upstream's change needs a look.
          git merge --no-commit --no-ff upstream/main >/dev/null 2>&1 || true
          git diff --name-only --diff-filter=U > "$RUNNER_TEMP/clashes"
          git merge --abort 2>/dev/null || true

          # Where upstream and this fork change the same lines, keep the fork's version.
          if ! git merge upstream/main -X ours -m "chore: merge upstream main"; then
            # Conflicts -X ours cannot settle (a file one side deleted): keep the fork's side.
            git ls-files -u | cut -f2 | sort -u | while IFS= read -r path; do
              if git ls-files -u -- "$path" | grep -q '^[0-9]* [0-9a-f]* 2'; then
                git checkout --ours -- "$path"
                git add -- "$path"
              else
                git rm -q --cached -- "$path"
              fi
            done
            git commit -m "chore: merge upstream main (kept fork changes on conflicts)"
          fi

          # BK replaces Silo's TV logo and setup mark with PNGs of the same names. Upstream
          # ships them as vectors, and two drawables with one name break the build, so drop
          # the vectors.
          D=androidTvApp/src/androidMain/res/drawable
          for name in silo_wordmark silo_mark; do
            if [ -f "$D/$name.png" ] && [ -f "$D/$name.xml" ]; then
              git rm -q "$D/$name.xml"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "chore: keep BK's TV logo and setup mark over the upstream vectors"
          fi
          git push origin custom

          if [ -s "$RUNNER_TEMP/clashes" ]; then
            { echo "Kept BK's version where upstream changed the same lines:"; sed 's/^/- /' "$RUNNER_TEMP/clashes"; } >> "$GITHUB_STEP_SUMMARY"
            if [ -n "$HOOK" ]; then
              MSG=$(printf "Upstream sync kept BK's version where Silo changed the same lines (%s files):\n%s" \
                "$(wc -l < "$RUNNER_TEMP/clashes")" "$(head -n 20 "$RUNNER_TEMP/clashes")")
              curl -sS -H "Content-Type: application/json" -d "$(jq -n --arg c "$MSG" '{content:$c}')" "$HOOK"
            fi
          fi
