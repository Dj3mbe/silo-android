name: Sync upstream
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: custom
          fetch-depth: 0
      - name: Merge upstream into custom
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Silo-Server/silo-android.git
          git fetch upstream main
          git push origin refs/remotes/upstream/main:refs/heads/main
          git merge upstream/main -m "chore: merge upstream main"
          git push origin custom
