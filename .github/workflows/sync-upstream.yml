name: Sync upstream
# Mirrors Silo's main branch into this fork's main, then merges it into custom.
# When both sides changed the same lines the merge is not made: the files are
# posted to Discord and custom waits for a hand merge. That merge is then
# recorded by running this by hand with "keep BK's side" ticked and applying the
# prepared repair zip straight after.
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      keep_ours:
        description: "Merge even where files clash, keeping BK's side (only with a repair zip ready)"
        type: boolean
        default: false
      upstream_commit:
        description: "Silo commit to merge (blank for the newest)"
        default: ""

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: custom
          fetch-depth: 0
          # GitHub's built-in token may not push changes to workflow files, which
          # upstream sometimes makes; SYNC_TOKEN is a token for this repository
          # with the Workflows permission.
          token: ${{ secrets.SYNC_TOKEN || github.token }}
      - name: Merge upstream into custom
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          KEEP_OURS: ${{ inputs.keep_ours }}
          UPSTREAM_COMMIT: ${{ inputs.upstream_commit }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Silo-Server/silo-android.git
          git fetch upstream main
          git push origin refs/remotes/upstream/main:refs/heads/main
          TARGET=${UPSTREAM_COMMIT:-upstream/main}

          # A trial merge lists the files where both sides changed the same lines.
          git merge --no-commit --no-ff "$TARGET" >/dev/null 2>&1 || true
          git diff --name-only --diff-filter=U > "$RUNNER_TEMP/clashes"
          git merge --abort 2>/dev/null || true

          if [ -s "$RUNNER_TEMP/clashes" ] && [ "$KEEP_OURS" != "true" ]; then
            MSG=$(printf "Upstream sync paused: Silo and BK changed the same lines in %s files, so custom needs a hand merge.\n%s" \
              "$(wc -l < "$RUNNER_TEMP/clashes")" "$(head -n 20 "$RUNNER_TEMP/clashes")")
            echo "$MSG" >> "$GITHUB_STEP_SUMMARY"
            if [ -n "$HOOK" ]; then
              curl -sS -H "Content-Type: application/json" -d "$(jq -n --arg c "$MSG" '{content:$c}')" "$HOOK"
            fi
            exit 0
          fi

          SUBJECT="chore: merge upstream main"
          if [ "$KEEP_OURS" = "true" ]; then
            SUBJECT="$SUBJECT (BK side kept on clashes)"
          fi
          if ! git merge "$TARGET" -X ours -m "$SUBJECT"; then
            # A conflict -X ours cannot settle (a file one side deleted) is never
            # resolved silently: abort and ask for a hand merge.
            git merge --abort
            MSG="Upstream sync paused: a conflict could not be settled automatically, so custom needs a hand merge."
            echo "$MSG" >> "$GITHUB_STEP_SUMMARY"
            if [ -n "$HOOK" ]; then
              curl -sS -H "Content-Type: application/json" -d "$(jq -n --arg c "$MSG" '{content:$c}')" "$HOOK"
            fi
            exit 0
          fi

          # BK replaces Silo's TV logo and setup mark with PNGs of the same names. Upstream
          # ships them as vectors, and two drawables with one name break the build, so drop
          # the vectors.
          D=androidTvApp/src/androidMain/res/drawable
          for name in silo_wordmark silo_mark; do
            if [ -f "$D/$name.png" ] && [ -f "$D/$name.xml" ]; then
              git rm -q "$D/$name.xml"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "chore: keep BK's TV logo and setup mark over the upstream vectors"
          fi
          git push origin custom
