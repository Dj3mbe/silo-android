name: Merge Silo build 30 into a custom test branch
# Merges Silo's release v1.0.0-beta.30 into custom on a NEW branch, custom-30.
# custom itself is never changed here. Build Lab APKs can then build custom-30
# as a test, and custom is updated only after that passes.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    env:
      TARGET: custom-30
      SILO_TAG: v1.0.0-beta.30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: custom
          fetch-depth: 0
      - name: Merge Silo build 30
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git remote add silo https://github.com/Silo-Server/silo-android.git
          git fetch --no-tags silo "refs/tags/${SILO_TAG}:refs/tags/silo-build"
          git switch -c "$TARGET"
          M=androidTvApp/src/androidMain/AndroidManifest.xml
          if ! git merge --no-ff --no-commit silo-build; then
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts"
            if [ "$(cat "$RUNNER_TEMP/conflicts")" != "$M" ]; then
              echo "::error::Unexpected conflicts. Nothing was pushed."
              cat "$RUNNER_TEMP/conflicts"
              git merge --abort
              exit 1
            fi
            # Keep both sides: BK's update permission and Silo's voice lines.
            python3 - "$M" <<'PY'
          import re, sys
          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()
          s = re.sub(r"<<<<<<< [^\n]*\n(.*?)=======\n(.*?)>>>>>>> [^\n]*\n", r"\1\2", s, flags=re.S)
          open(p, "w", encoding="utf-8").write(s)
          PY
          fi
      - name: Switch to Silo's voice search
        run: |
          S=androidTvApp/src/androidMain/kotlin/org/siloserver/silo/tv/ui/screens/search
          M=androidTvApp/src/androidMain/AndroidManifest.xml
          python3 - "$S/TvSearchScreen.kt" "$M" <<'PY'
          import re, subprocess, sys
          screen, manifest = sys.argv[1], sys.argv[2]
          theirs = subprocess.run(["git", "show", "silo-build:" + screen],
                                  capture_output=True, text=True, check=True).stdout
          block = re.search(r"    val voiceSearch = rememberTvVoiceSearch\(\n.*?\n    \)\n", theirs, re.S).group(0)
          s = open(screen, encoding="utf-8").read()
          s, n = re.subn(r"    val handleSpoken: .*?\n    val voiceSearch = remember\(.*?\n    \}\n",
                         lambda _: block, s, count=1, flags=re.S)
          assert n == 1, "voice block not found"
          open(screen, "w", encoding="utf-8").write(s)
          m = open(manifest, encoding="utf-8").read()
          m, n = re.subn(r'    <!-- BK: in-app voice search[^\n]*-->\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n'
                         r'    <uses-feature\n        android:name="android.hardware.microphone"\n        android:required="false" />\n\n',
                         "", m, count=1)
          assert n == 1, "BK voice permission block not found"
          open(manifest, "w", encoding="utf-8").write(m)
          PY
          git rm -qf -- "$S/TvInAppVoice.kt"
          git add -- "$S/TvSearchScreen.kt" "$M"
      - name: Check the result before committing
        run: |
          S=androidTvApp/src/androidMain/kotlin/org/siloserver/silo/tv/ui/screens/search
          if git diff --cached --name-only HEAD -- '*/res/*.png' '*/res/*.mp4' '*/res/*.webp' '*/res/*.xml' | grep .; then
            echo "::error::A resource would change."; exit 1
          fi
          if git grep --cached -nE '^(<<<<<<<|>>>>>>>) ' -- '*.kt' '*.kts' '*.xml' '*.yml'; then
            echo "::error::Conflict markers left in the merge."; exit 1
          fi
          if ! git diff --cached --quiet HEAD -- .github; then
            echo "::error::The merge would change a workflow."; exit 1
          fi
          if git grep --cached -nE 'InAppVoice' -- androidTvApp; then
            echo "::error::Leftover reference to the removed in-app voice code."; exit 1
          fi
          git cat-file -e ":$S/LegacyTvVoiceSearch.kt"
          # BK's other search screen edits must survive.
          git grep --cached -q 'focusedBorderColor = FocusAccent' -- "$S/TvSearchScreen.kt"
          git grep --cached -q 'Modifier.height(64.dp)' -- "$S/TvSearchScreen.kt"
          # Voice permissions: only Silo's RECORD_AUDIO line (Android 11 and older).
          git grep --cached -q 'RECORD_AUDIO" android:maxSdkVersion="30"' -- androidTvApp/src/androidMain/AndroidManifest.xml
          if git grep --cached -q 'RECORD_AUDIO" />' -- androidTvApp/src/androidMain/AndroidManifest.xml; then
            echo "::error::BK's own microphone permission is still present."; exit 1
          fi
          git grep --cached -n 'RECORD_AUDIO\|REQUEST_INSTALL_PACKAGES' -- androidTvApp/src/androidMain/AndroidManifest.xml
      - name: Commit and push the test branch
        run: |
          git commit -m "Merge Silo build 30 into custom (test branch)"
          git push origin "HEAD:refs/heads/${TARGET}"
