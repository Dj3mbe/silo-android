name: Build APKs
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "release (small, fast) or debug (fallback)"
        type: choice
        options: [release, debug]
        default: release
  workflow_run:
    workflows: ["Sync upstream"]
    types: [completed]
permissions:
  contents: write
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      KS_PASS: ${{ secrets.BK_KEYSTORE_PASSWORD }}
      VARIANT: ${{ inputs.variant || 'release' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: custom
      - name: Work out build tag and version, skip if already released
        id: chk
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "tag=build-$SHA" >> $GITHUB_OUTPUT
          BUILD=${{ github.run_number }}
          if [ "$BUILD" -gt 999 ]; then BUILD=999; fi
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          # Mirror Silo's own numbering: the tester build with the highest build
          # number, tagged v<major>.<minor>.<patch>-beta.<build> (or older +<build>).
          TAGS=$(git ls-remote --tags https://github.com/Silo-Server/silo-android.git 'refs/tags/v*' | awk '{print $2}' | sed 's|refs/tags/||; s|\^{}$||' | sort -u || true)
          read -r SILO_BUILD VER <<< "$(echo "$TAGS" | sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+)-beta\.([0-9]+)$/\2 \1/p; s/^v([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)$/\2 \1/p; s/^v([0-9]+\.[0-9]+\.[0-9]+)-[0-9A-Za-z.]+\+([0-9]+)$/\2 \1/p' | sort -n | tail -1)" || true
          if [ -z "$VER" ] || [ -z "$SILO_BUILD" ]; then VER=1.0.1; SILO_BUILD=$BUILD; fi
          echo "ver=$VER" >> $GITHUB_OUTPUT
          echo "silobuild=$SILO_BUILD" >> $GITHUB_OUTPUT
          # Our own always-rising code (the app compares this for updates); it is
          # deliberately not tied to Silo's version so updates never go backwards.
          echo "code=$((110001000 + BUILD))" >> $GITHUB_OUTPUT
          echo "Silo $VER build $SILO_BUILD; BK build $BUILD"
          # A sync that kept BK's side on clashing lines is held back: it stays a
          # prerelease so the in-app updater (which follows the latest release)
          # does not offer it until someone has tested it.
          if git log -1 --merges --format=%B | grep -q "BK side kept on clashes"; then
            echo "hold=true" >> $GITHUB_OUTPUT
            echo "Held: the newest commit kept BK's side on clashing lines."
          else
            echo "hold=false" >> $GITHUB_OUTPUT
          fi
          if [ "${{ github.event_name }}" = "workflow_run" ] && gh release view "build-$SHA" >/dev/null 2>&1; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Nothing new since build-$SHA, skipping."
          fi
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        if: steps.chk.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        if: steps.chk.outputs.skip != 'true'
      - name: Build phone APK
        if: steps.chk.outputs.skip != 'true'
        run: |
          ./gradlew :androidApp:assemble${VARIANT^} --max-workers=2 \
            -PsiloVersionName=${{ steps.chk.outputs.ver }} -PsiloBuildNumber=${{ steps.chk.outputs.silobuild }} -PsiloVersionCode=${{ steps.chk.outputs.code }} \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            -Pkotlin.daemon.jvmargs="-Xmx4g"
      - name: Build TV APK
        if: steps.chk.outputs.skip != 'true'
        run: |
          ./gradlew :androidTvApp:assemble${VARIANT^} --max-workers=2 \
            -PsiloVersionName=${{ steps.chk.outputs.ver }} -PsiloBuildNumber=${{ steps.chk.outputs.silobuild }} -PsiloVersionCode=${{ steps.chk.outputs.code }} \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            -Pkotlin.daemon.jvmargs="-Xmx4g"
      - name: Sign with the permanent BK key
        if: steps.chk.outputs.skip != 'true'
        run: |
          echo "${{ secrets.BK_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/bk.jks"
          AS=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          mkdir out
          cp "$(find androidApp/build/outputs/apk/$VARIANT -name '*universal*.apk' | head -1)" out/BK-phone.apk
          cp "$(find androidTvApp/build/outputs/apk/$VARIANT -name '*universal*.apk' | head -1)" out/BK-tv.apk
          for f in out/BK-phone.apk out/BK-tv.apk; do
            $AS sign --ks "$RUNNER_TEMP/bk.jks" --ks-key-alias bk --ks-pass env:KS_PASS --key-pass env:KS_PASS "$f"
            $AS verify "$f"
          done
      - name: Publish release
        id: pub
        if: steps.chk.outputs.skip != 'true'
        run: |
          TAG=${{ steps.chk.outputs.tag }}
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          # Friendly name: the short date (Toronto time) plus v1, v2, v3 for each release that day, e.g. "BK Nov 5 v2".
          DAY=$(TZ=America/Toronto date '+%b %-d')
          N=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].name' | grep -c "^BK $DAY v" || true)
          LABEL="BK $DAY v$((N + 1))"
          echo "label=$LABEL" >> $GITHUB_OUTPUT
          if [ "${{ steps.chk.outputs.hold }}" = "true" ]; then RELEASE_KIND=--prerelease; else RELEASE_KIND=--latest; fi
          gh release create "$TAG" out/BK-phone.apk out/BK-tv.apk \
            --title "$LABEL" \
            --notes "$LABEL: automatic $VARIANT build of the custom branch at ${{ steps.chk.outputs.sha }} (build ${{ steps.chk.outputs.build }}; Silo ${{ steps.chk.outputs.ver }} build ${{ steps.chk.outputs.silobuild }}; code ${{ steps.chk.outputs.code }})." \
            --target custom "$RELEASE_KIND"
      - name: Post to Discord
        if: steps.chk.outputs.skip != 'true' && steps.chk.outputs.hold != 'true'
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LABEL: ${{ steps.pub.outputs.label }}
        run: |
          if [ -n "$HOOK" ]; then
            MSG="New $LABEL is ready (Silo ${{ steps.chk.outputs.ver }} build ${{ steps.chk.outputs.silobuild }}): https://github.com/${{ github.repository }}/releases/tag/${{ steps.chk.outputs.tag }}"
            curl -sS -H "Content-Type: application/json" -d "$(jq -n --arg c "$MSG" '{content:$c}')" "$HOOK"
          fi
