name: Build APKs
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "release (small, fast) or debug (fallback)"
        type: choice
        options: [release, debug]
        default: release
  workflow_run:
    workflows: ["Sync upstream"]
    types: [completed]
permissions:
  contents: write
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      KS_PASS: ${{ secrets.BK_KEYSTORE_PASSWORD }}
      VARIANT: ${{ inputs.variant || 'release' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: custom
      - name: Work out build tag and version, skip if already released
        id: chk
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "tag=build-$SHA" >> $GITHUB_OUTPUT
          BUILD=${{ github.run_number }}
          if [ "$BUILD" -gt 999 ]; then BUILD=999; fi
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          # Follow Silo's latest official release (v<major>.<minor>.<patch>+<n>).
          VER=$(git ls-remote --tags https://github.com/Silo-Server/silo-android.git 'refs/tags/v*' \
            | awk '{print $2}' | sed 's|refs/tags/v||; s|\^{}$||' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$' | sed 's|+.*||' | sort -uV | tail -1 || true)
          if [ -z "$VER" ]; then VER=1.0.1; fi
          IFS=. read -r MAJ MIN PAT <<< "$VER"
          echo "ver=$VER" >> $GITHUB_OUTPUT
          echo "code=$((100000000 + (MAJ*10000 + MIN*100 + PAT)*1000 + BUILD))" >> $GITHUB_OUTPUT
          echo "Silo version $VER, build $BUILD"
          if [ "${{ github.event_name }}" = "workflow_run" ] && gh release view "build-$SHA" >/dev/null 2>&1; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Nothing new since build-$SHA, skipping."
          fi
      - uses: actions/setup-java@v4
        if: steps.chk.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        if: steps.chk.outputs.skip != 'true'
      - name: Build phone APK
        if: steps.chk.outputs.skip != 'true'
        run: |
          ./gradlew :androidApp:assemble${VARIANT^} --max-workers=2 \
            -PsiloVersionName=${{ steps.chk.outputs.ver }} -PsiloBuildNumber=${{ steps.chk.outputs.build }} -PsiloVersionCode=${{ steps.chk.outputs.code }} \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            -Pkotlin.daemon.jvmargs="-Xmx4g"
      - name: Build TV APK
        if: steps.chk.outputs.skip != 'true'
        run: |
          ./gradlew :androidTvApp:assemble${VARIANT^} --max-workers=2 \
            -PsiloVersionName=${{ steps.chk.outputs.ver }} -PsiloBuildNumber=${{ steps.chk.outputs.build }} -PsiloVersionCode=${{ steps.chk.outputs.code }} \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            -Pkotlin.daemon.jvmargs="-Xmx4g"
      - name: Sign with the permanent BK key
        if: steps.chk.outputs.skip != 'true'
        run: |
          echo "${{ secrets.BK_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/bk.jks"
          AS=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          mkdir out
          cp "$(find androidApp/build/outputs/apk/$VARIANT -name '*universal*.apk' | head -1)" out/BK-phone.apk
          cp "$(find androidTvApp/build/outputs/apk/$VARIANT -name '*universal*.apk' | head -1)" out/BK-tv.apk
          for f in out/BK-phone.apk out/BK-tv.apk; do
            $AS sign --ks "$RUNNER_TEMP/bk.jks" --ks-key-alias bk --ks-pass env:KS_PASS --key-pass env:KS_PASS "$f"
            $AS verify "$f"
          done
      - name: Publish release
        if: steps.chk.outputs.skip != 'true'
        run: |
          TAG=${{ steps.chk.outputs.tag }}
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$TAG" out/BK-phone.apk out/BK-tv.apk \
            --title "BK build ${{ steps.chk.outputs.sha }}" \
            --notes "Automatic $VARIANT build of the custom branch at ${{ steps.chk.outputs.sha }} (version ${{ steps.chk.outputs.ver }}, build ${{ steps.chk.outputs.build }})." \
            --target custom --latest
      - name: Post to Discord
        if: steps.chk.outputs.skip != 'true'
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "$HOOK" ]; then
            MSG="New BK $VARIANT build ${{ steps.chk.outputs.sha }} (v${{ steps.chk.outputs.ver }} build ${{ steps.chk.outputs.build }}) is ready: https://github.com/${{ github.repository }}/releases/tag/${{ steps.chk.outputs.tag }}"
            curl -sS -H "Content-Type: application/json" -d "$(jq -n --arg c "$MSG" '{content:$c}')" "$HOOK"
          fi
