name: Apply BK assets
# Unpacks every bk-upload-*.zip at the top of a branch into place, in name order,
# removes the zips and commits the result to that branch.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to apply the zips on"
        default: custom
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ inputs.branch || 'custom' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.BRANCH }}
      - name: Unpack bk-upload zips into place
        run: |
          shopt -s nullglob
          zips=(bk-upload-*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No bk-upload zips to apply."
            exit 0
          fi
          for z in "${zips[@]}"; do
            unzip -oq "$z"
            git rm -q -- "$z"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply ${zips[*]}"
          git push origin "HEAD:refs/heads/$BRANCH"
