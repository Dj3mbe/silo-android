name: Build Lab APKs
# Builds the "lab" branch as a separate app (BK Lab, com.bingekings.lab) so it installs
# beside BK and Silo. Run it by hand from the Actions tab. It never touches BK's releases,
# the "latest" release, the BK updater or the Discord post.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build"
        default: lab
      variant:
        description: "release (small, fast) or debug (fallback)"
        type: choice
        options: [release, debug]
        default: release
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      KS_PASS: ${{ secrets.BK_KEYSTORE_PASSWORD }}
      VARIANT: ${{ inputs.variant || 'release' }}
      BRANCH: ${{ inputs.branch || 'lab' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
      - name: Put the LAB images and splash in place (build time only)
        run: |
          if [ -f bk-upload-labassets.zip ]; then unzip -oq bk-upload-labassets.zip; fi
          if [ -d lab-assets ]; then cp -r lab-assets/. . ; fi

      - name: Work out version
        id: chk
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          BUILD=${{ github.run_number }}
          if [ "$BUILD" -gt 999 ]; then BUILD=999; fi
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "code=$((130001000 + BUILD))" >> $GITHUB_OUTPUT
      - name: Turn the code into BK Lab (app id, name, updater) at build time only
        run: |
          sed -i 's/applicationId = "com.bingekings.app"/applicationId = "com.bingekings.lab"/' androidApp/build.gradle.kts androidTvApp/build.gradle.kts
          sed -i 's#<string name="app_name">BK</string>#<string name="app_name">BK Lab</string>#' androidApp/src/androidMain/res/values/strings.xml androidTvApp/src/androidMain/res/values/strings.xml
          U=android-shared/src/androidMain/kotlin/org/siloserver/silo/common/ui/BkUpdater.kt
          sed -i 's#releases/latest/download/#releases/download/lab-latest/#; s#/releases/latest")#/releases/tags/lab-latest")#' "$U"
          grep -q 'com.bingekings.lab' androidApp/build.gradle.kts
          grep -q 'com.bingekings.lab' androidTvApp/build.gradle.kts
          grep -q 'BK Lab' androidTvApp/src/androidMain/res/values/strings.xml
          grep -q 'lab-latest/' "$U"
          grep -q 'tags/lab-latest' "$U"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build phone APK
        run: |
          ./gradlew :androidApp:assemble${VARIANT^} --max-workers=2 \
            -PsiloVersionName=1.0.1 -PsiloBuildNumber=${{ steps.chk.outputs.build }} -PsiloVersionCode=${{ steps.chk.outputs.code }} \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            -Pkotlin.daemon.jvmargs="-Xmx4g"
      - name: Build TV APK
        run: |
          ./gradlew :androidTvApp:assemble${VARIANT^} --max-workers=2 \
            -PsiloVersionName=1.0.1 -PsiloBuildNumber=${{ steps.chk.outputs.build }} -PsiloVersionCode=${{ steps.chk.outputs.code }} \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            -Pkotlin.daemon.jvmargs="-Xmx4g"
      - name: Sign with the BK key
        run: |
          echo "${{ secrets.BK_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/bk.jks"
          AS=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          mkdir out
          cp "$(find androidApp/build/outputs/apk/$VARIANT -name '*universal*.apk' | head -1)" out/BK-phone.apk
          cp "$(find androidTvApp/build/outputs/apk/$VARIANT -name '*universal*.apk' | head -1)" out/BK-tv.apk
          for f in out/BK-phone.apk out/BK-tv.apk; do
            $AS sign --ks "$RUNNER_TEMP/bk.jks" --ks-key-alias bk --ks-pass env:KS_PASS --key-pass env:KS_PASS "$f"
            $AS verify "$f"
          done
      - name: Publish to the lab-latest pre-release
        run: |
          gh release delete lab-latest --yes --cleanup-tag >/dev/null 2>&1 || true
          DAY=$(TZ=America/Toronto date '+%b %-d %H:%M')
          gh release create lab-latest out/BK-phone.apk out/BK-tv.apk \
            --title "BK Lab $DAY" \
            --notes "BK Lab build of $BRANCH at ${{ steps.chk.outputs.sha }} (build ${{ steps.chk.outputs.build }}; code ${{ steps.chk.outputs.code }}). Test build, not for everyone." \
            --target "$BRANCH" --prerelease --latest=false
