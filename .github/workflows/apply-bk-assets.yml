name: Apply BK assets
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: custom
      - name: Unpack bk-upload zips into place
        run: |
          for z in bk-upload-*.zip; do
            unzip -o "$z"
            rm -f "$z"
          done
          rm -f androidTvApp/src/androidMain/res/drawable/silo_mark.xml
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Apply BK splash and TV setup mark"
          git push origin custom
